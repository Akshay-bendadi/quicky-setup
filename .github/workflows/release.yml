name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release tag::Release tags must use semver format, for example v1.2.3."
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "::error title=Release tag mismatch::Release tag does not match package.json version."
            exit 1
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build and verify
        run: npm run check

      - name: Dry-run package contents
        run: npm run pack:dry-run

      - name: Pack release tarball
        id: pack
        run: |
          package_file="$(npm pack --silent)"
          shasum -a 256 "$package_file" > checksums.txt
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with provenance
        shell: bash
        run: |
          npm whoami

          set +e
          npm publish "${{ steps.pack.outputs.package_file }}" --provenance --access public 2>&1 | tee npm-publish.log
          publish_status="${PIPESTATUS[0]}"
          set -e

          if [ "${publish_status}" -ne 0 ]; then
            {
              echo "### npm publish failed"
              echo
              echo '```text'
              tail -n 80 npm-publish.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            message="$(tail -n 20 npm-publish.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=npm publish failed::${message}"
            exit "${publish_status}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "$PACKAGE_FILE" checksums.txt \
            --title "firstbase $GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME" \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.pack.outputs.package_file }}
